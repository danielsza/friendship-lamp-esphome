# Shared firmware for the Loooit / FriendLamps "Friendship Lamp" (ESP32-C5 version, flp_c5).
# Each lamp has a small YAML that sets `name`, `friendly_name` and `default_tap_action`
# and then includes this file as a package.
#
# Hardware (found by reading the stock firmware and confirmed on a lamp):
#   GPIO27  WS2812 data, 16 LEDs, GRB
#   GPIO3   touch pad: 3.3 V idle, 0 V while touched
#   UART0 (default pins) on the TXD/RXD header pads: serial flashing and logs

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32c5
  flash_size: 4MB
  framework:
    type: esp-idf
    version: recommended

# The USB-C socket is power only, so logs go to the TXD/RXD header pads.
logger:
  level: DEBUG
  hardware_uart: UART0
  baud_rate: 115200

api:
  encryption:
    key: !secret lamp_api_key

ota:
  - platform: esphome
    password: !secret lamp_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"
    password: !secret lamp_ap_password

captive_portal:

# Reports why the lamp last restarted (power on, software restart, watchdog, brownout).
debug:
  update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset reason"

button:
  - platform: restart
    name: "Restart"

globals:
  - id: status_idx
    type: int
    restore_value: no
    initial_value: '0'

light:
  - platform: esp32_rmt_led_strip
    id: lamp_light
    name: "Lamp"
    pin:
      number: GPIO27
      ignore_strapping_warning: true
    num_leds: 16
    chipset: WS2812
    channel_colors: GRB
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      - pulse:
          name: "Breathe"
          transition_length: 1.5s
          update_interval: 1.5s
          min_brightness: 8%
          max_brightness: 100%
      - pulse:
          name: "Flash"
          transition_length: 0s
          update_interval: 0.4s
          min_brightness: 0%
          max_brightness: 100%
      - addressable_rainbow:
          name: "Rainbow"

# What a tap on the top of the lamp does. Changed from Home Assistant, remembered across restarts.
select:
  - platform: template
    id: tap_action
    name: "Tap action"
    icon: "mdi:gesture-tap"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: ${default_tap_action}
    options:
      - "Status"   # tap: green -> red -> green ...
      - "Call"     # tap: breathing amber
      - "Toggle"   # tap: light on/off
      - "None"     # tap does nothing locally (Home Assistant still sees it)

# "Call" is on while the lamp is breathing amber. Home Assistant can switch it too.
switch:
  - platform: template
    id: call_switch
    name: "Call"
    icon: "mdi:bell-ring"
    lambda: |-
      return id(lamp_light).remote_values.is_on() &&
             id(lamp_light).get_effect_name() == "Breathe";
    turn_on_action:
      - light.turn_on:
          id: lamp_light
          brightness: 100%
          red: 100%
          green: 71%
          blue: 0%
          effect: "Breathe"
    turn_off_action:
      - light.turn_off: lamp_light

# Every tap and hold is also sent to Home Assistant, whatever the tap action is.
event:
  - platform: template
    id: touch_gesture
    name: "Touch gesture"
    icon: "mdi:gesture-tap-hold"
    event_types:
      - "tap"
      - "hold"

script:
  # Started when the pad is touched and stopped on release, so it only finishes on a hold.
  - id: hold_off
    mode: restart
    then:
      - delay: 800ms
      - event.trigger:
          id: touch_gesture
          event_type: "hold"
      - light.turn_off: lamp_light

binary_sensor:
  - platform: gpio
    id: lamp_touch
    name: "Touch"
    pin:
      number: GPIO3
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 100ms
    on_press:
      - script.execute: hold_off
    on_release:
      - script.stop: hold_off
    on_click:
      min_length: 30ms
      max_length: 700ms
      then:
        - event.trigger:
            id: touch_gesture
            event_type: "tap"
        - lambda: |-
            auto mode = id(tap_action).active_index().value_or(3);
            if (mode == 0) {
              // Status: off -> green, then green <-> red
              if (!id(lamp_light).remote_values.is_on()) {
                id(status_idx) = 0;
              } else {
                id(status_idx) = (id(status_idx) + 1) % 2;
              }
              auto call = id(lamp_light).turn_on();
              call.set_effect("None");
              call.set_brightness(1.0);
              if (id(status_idx) == 0) {
                call.set_rgb(0.0, 1.0, 0.0);
              } else {
                call.set_rgb(1.0, 0.0, 0.0);
              }
              call.perform();
            } else if (mode == 1) {
              id(call_switch).turn_on();
            } else if (mode == 2) {
              id(lamp_light).toggle().perform();
            }
